<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e11d48" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Blood Droplet / Shield Base with Glow -->
  <path
    d="M32 4 C32 4, 10 26, 10 40 C10 52.15, 19.85 62, 32 62 C44.15 62, 54 52.15, 54 40 C54 26, 32 4, 32 4 Z"
    fill="url(#bgGrad)"
    filter="url(#glow)"
  />

  <!-- Subtle Highlight Curve -->
  <path
    d="M20 32 C18 36, 17 40, 18 45"
    stroke="#ffffff"
    stroke-width="3"
    stroke-linecap="round"
    stroke-opacity="0.35"
  />

  <!-- RaktaRun ECG Rhythm Wave -->
  <path
    d="M16 41 L24 41 L27 34 L31 47 L36 29 L40 44 L43 41 L48 41"
